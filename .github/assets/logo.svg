<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="vo-title">
    <title id="vo-title">vouchr: three token segments, vouched for by a seal</title>
    <defs>
        <linearGradient id="vo-tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0E9F8F" stop-opacity=".22"/>
            <stop offset="1" stop-color="#E0962B" stop-opacity=".22"/>
        </linearGradient>
        <linearGradient id="vo-edge" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0E9F8F"/>
            <stop offset="1" stop-color="#E0962B"/>
        </linearGradient>
        <linearGradient id="vo-seal" x1="150" y1="130" x2="226" y2="214" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#F0A93A"/>
            <stop offset="1" stop-color="#C9781A"/>
        </linearGradient>
    </defs>

    <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#vo-tile)"/>
    <rect x="4" y="4" width="248" height="248" rx="52" fill="none" stroke="url(#vo-edge)" stroke-opacity=".7" stroke-width="3"/>

    <!-- the token: header . payload . signature -->
    <g fill="#0E9F8F">
        <rect x="40" y="62" width="120" height="26" rx="13" opacity=".55">
            <animate attributeName="width" values="0;120" dur="0.6s" begin="0s" repeatCount="1" fill="freeze"/>
        </rect>
        <rect x="40" y="104" width="150" height="26" rx="13" opacity=".8">
            <animate attributeName="width" values="0;0;150" keyTimes="0;0.25;1" dur="0.8s" begin="0s" repeatCount="1" fill="freeze"/>
        </rect>
        <rect x="40" y="146" width="96" height="26" rx="13">
            <animate attributeName="width" values="0;0;96" keyTimes="0;0.4;1" dur="1s" begin="0s" repeatCount="1" fill="freeze"/>
        </rect>
    </g>
    <!-- the seal that vouches for it -->
    <g transform="translate(0 0)">
        <animateTransform attributeName="transform" type="translate" values="0 -36;0 -36;0 0" keyTimes="0;0.6;1" dur="1.4s" begin="0s" repeatCount="1" fill="freeze"/>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="1.4s" begin="0s" repeatCount="1" fill="freeze"/>
        <circle cx="188" cy="172" r="42" fill="url(#vo-seal)"/>
        <circle cx="188" cy="172" r="33" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3" stroke-dasharray="5 6"/>
        <path d="M169 172 L183 186 L208 158" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="60" stroke-dashoffset="0">
            <animate attributeName="stroke-dashoffset" values="60;60;0" keyTimes="0;0.7;1" dur="2.2s" begin="0s" repeatCount="1" fill="freeze"/>
        </path>
    </g>
</svg>
